
{% if page_obj.has_other_pages %}
<nav aria-label="Book pagination">
    <ul class="pagination justify-content-center">

        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link"
               href="?page=1{% if query_params %}&{{ query_params }}{% endif %}">
                First
            </a>
        </li>
        <li class="page-item">
            <a class="page-link"
               href="?page={{ page_obj.previous_page_number }}{% if query_params %}&{{ query_params }}{% endif %}">
                Previous
            </a>
        </li>
        {% endif %}

        <li class="page-item active">
            <span class="page-link">
                Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
            </span>
        </li>

        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link"
               href="?page={{ page_obj.next_page_number }}{% if query_params %}&{{ query_params }}{% endif %}">
                Next
            </a>
        </li>
        <li class="page-item">
            <a class="page-link"
               href="?page={{ page_obj.paginator.num_pages }}{% if query_params %}&{{ query_params }}{% endif %}">
                Last
            </a>
        </li>
        {% endif %}

    </ul>
</nav>
{% endif %}
